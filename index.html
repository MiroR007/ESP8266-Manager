<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP8266 Manager</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#e9eefb;background:#0b1020}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#182b55 0%,#0b1020 55%)}.wrap{max-width:980px;margin:auto;padding:32px 20px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:800}.brand span{color:#72b7ff}select,button{font:inherit;border-radius:12px;padding:12px 16px}select{background:#17243c;color:white;border:1px solid #344663}h1{font-size:clamp(32px,5vw,52px);margin:70px 0 12px}p{color:#aebcd4;line-height:1.7}.badge{display:inline-block;color:#8ed9bf;background:#15382f;border-radius:100px;padding:7px 13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:30px}.card{background:#141f34;border:1px solid #2b3c59;border-radius:20px;padding:24px;min-height:210px}.card h2{margin:0 0 10px;font-size:20px}.card p{min-height:58px}button{background:#448bfa;color:white;border:0;font-weight:700;cursor:pointer}button:hover{background:#66a2ff}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#273c5a}.note{margin-top:28px;padding:18px;border:1px solid #385073;border-radius:14px;background:#111d33}#status{font-weight:700;color:#b3c5e1}footer{margin-top:45px;color:#8194b4;font-size:13px}body[dir=rtl] .wrap{text-align:right}
</style></head><body><div class="wrap">
<header><div class="brand">ESP<span>8266</span> Manager</div><select id="lang" aria-label="Language"><option value="ar">العربية</option><option value="ku">Kurdî (Kurmanji)</option><option value="en">English</option></select></header>
<main><h1 data-i="title"></h1><p data-i="subtitle"></p><span class="badge" data-i="phase"></span>
<div class="grid"><section class="card"><h2 data-i="connect"></h2><p data-i="connectDesc"></p><button id="connectBtn" data-i="connectBtn"></button><p id="status" role="status"></p></section>
<section class="card"><h2 data-i="info"></h2><p data-i="infoDesc"></p><button disabled data-i="coming"></button></section>
<section class="card"><h2 data-i="backup"></h2><p data-i="backupDesc"></p><button disabled data-i="coming"></button></section>
<section class="card"><h2 data-i="restore"></h2><p data-i="restoreDesc"></p><button disabled data-i="coming"></button></section></div>
<div class="note" data-i="warning"></div></main><footer data-i="footer"></footer></div>
<script>
const t={
ar:{title:"إدارة جهاز ESP8266 بسهولة",subtitle:"موقع متعدد اللغات للاتصال بجهازك عبر USB. هذه نسخة أولية: الاتصال فقط متاح حالياً، والنسخ الاحتياطي قيد التطوير.",phase:"الإصدار الأولي",connect:"الاتصال بالجهاز",connectDesc:"اختر منفذ USB الخاص بجهازك من نافذة المتصفح.",connectBtn:"اتصال USB",info:"معلومات الجهاز",infoDesc:"قراءة نوع الشريحة وحجم ذاكرة Flash.",backup:"نسخة احتياطية",backupDesc:"حفظ محتويات ذاكرة Flash في ملف BIN على الكمبيوتر.",restore:"استعادة النظام",restoreDesc:"استعادة نسخة BIN بعد التحقق منها وتأكيد العملية.",coming:"قريباً",warning:"تنبيه: لا تمسح ذاكرة الجهاز أو تثبّت نظاماً جديداً قبل التأكد من وجود نسخة احتياطية سليمة. الاتصال وحده لا يقرأ أو يغيّر ذاكرة الجهاز.",footer:"يتطلب Chrome أو Edge على كمبيوتر، وموقع HTTPS. الاتصال التسلسلي محلي ولا تُرفع بيانات الجهاز إلى خادم.",unsupported:"المتصفح لا يدعم Web Serial. استخدم Chrome أو Edge على الكمبيوتر.",connected:"تم فتح منفذ USB بنجاح. لم تُقرأ ذاكرة الجهاز.",error:"تعذّر الاتصال: ",disconnected:"غير متصل"},
ku:{title:"Rêveberiya ESP8266 bi hêsanî",subtitle:"Malperek pirzimanî ji bo girêdana amûra te bi USB. Ev guhertoya destpêkê ye: niha tenê girêdan amade ye.",phase:"Guhertoya destpêkê",connect:"Girêdana amûrê",connectDesc:"Ji pencereya gerokê porta USB ya amûra xwe hilbijêre.",connectBtn:"Bi USB ve girêde",info:"Agahiyên amûrê",infoDesc:"Nasîna çîpê û mezinahiya bîra Flash.",backup:"Kopiya ewlehiyê",backupDesc:"Tomarkirina bîra Flash di pelê BIN de.",restore:"Vegerandina pergalê",restoreDesc:"Vegerandina pelê BIN piştî kontrol û pejirandinê.",coming:"Di demeke nêz de",warning:"Hişyarî: Berî ku kopiyeke ewlehiyê ya rast hebê, bîra amûrê jê nebe û firmware nû saz neke. Girêdan bi tena serê xwe tiştek naguhere.",footer:"Chrome an Edge li ser komputerê û HTTPS pêwîst in. Girêdan herêmî ye.",unsupported:"Geroka te Web Serial piştgirî nake. Chrome an Edge bi kar bîne.",connected:"Porta USB hat vekirin. Bîra amûrê nehatiye xwendin.",error:"Girêdan bi ser neket: ",disconnected:"Ne girêdayî"},
en:{title:"Manage your ESP8266 with ease",subtitle:"A multilingual website for connecting to your board over USB. Early preview: only USB connection is implemented; backup is under development.",phase:"Early preview",connect:"Connect device",connectDesc:"Choose your board's USB serial port in the browser prompt.",connectBtn:"Connect USB",info:"Device information",infoDesc:"Read chip model and flash memory size.",backup:"Flash backup",backupDesc:"Save flash contents as a BIN file on your computer.",restore:"Restore firmware",restoreDesc:"Restore a validated BIN file after explicit confirmation.",coming:"Coming soon",warning:"Warning: Do not erase or flash your device until a verified backup exists. Connecting alone does not read or modify device flash.",footer:"Requires Chrome or Edge on desktop and HTTPS. Serial communication stays local.",unsupported:"Web Serial is unavailable. Use Chrome or Edge on desktop.",connected:"USB port opened successfully. Flash memory has not been read.",error:"Connection failed: ",disconnected:"Not connected"}};
let port=null;const status=document.getElementById('status'),lang=document.getElementById('lang');
function render(){const l=lang.value;document.documentElement.lang=l;document.body.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t[l][el.dataset.i]);status.textContent=port?t[l].connected:t[l].disconnected;localStorage.setItem('esp-lang',l)}
lang.value=localStorage.getItem('esp-lang')||'ar';lang.addEventListener('change',render);render();
document.getElementById('connectBtn').addEventListener('click',async()=>{const s=t[lang.value];if(!('serial' in navigator)){status.textContent=s.unsupported;return}try{if(port){await port.close();port=null;render();return}port=await navigator.serial.requestPort();await port.open({baudRate:115200});status.textContent=s.connected;document.getElementById('connectBtn').textContent='Disconnect'}catch(e){port=null;status.textContent=s.error+e.message}});
</script></body></html>
