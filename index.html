<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESP8266 Manager</title>
<style>:root{font-family:system-ui,Arial;color:#eef3ff;background:#0b1020}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0%,#1a315b,#0b1020 60%);min-height:100vh}.wrap{max-width:1050px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-weight:900;font-size:22px}.logo span{color:#6cb4ff}h1{font-size:clamp(30px,5vw,49px);margin:60px 0 10px}p{line-height:1.6;color:#b8c7df}select,input,button{font:inherit;border-radius:10px;padding:11px 13px}select,input{background:#1a2843;color:white;border:1px solid #3b5074}input[type=file]{width:100%;max-width:100%}button{background:#4389f5;color:#fff;border:0;cursor:pointer;font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#304463}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;margin:28px 0}.card{background:#152138;border:1px solid #2c4162;border-radius:18px;padding:22px}.card h2{font-size:19px;margin:0 0 10px}.card p{min-height:46px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.row>*{flex-shrink:0}.notice{padding:15px;border-radius:12px;background:#13263b;border:1px solid #315275;margin:18px 0}progress{width:100%;height:19px;accent-color:#58a4ff}#log{white-space:pre-wrap;word-break:break-word;max-height:200px;overflow:auto;background:#080e1c;padding:14px;border-radius:12px;color:#a9d0fc;font-size:12px}#details{white-space:pre-wrap;word-break:break-word;color:#a7d7ff}.small{font-size:13px;color:#91a9c9}footer{margin:40px 0;color:#91a9c9}body[dir=rtl]{text-align:right}</style></head><body><div class="wrap">
<header><div class="logo">ESP<span>8266</span> Manager</div><select id="lang"><option value="ar">العربية</option><option value="ku">Kurdî (Kurmanji)</option><option value="en">English</option></select></header>
<h1 data-i="title"></h1><p data-i="intro"></p>
<div class="grid"><section class="card"><h2 data-i="connect"></h2><p data-i="connectDesc"></p><div class="row"><button id="connectBtn" data-i="connectBtn"></button><button id="disconnectBtn" class="secondary" disabled data-i="disconnect"></button></div><p id="status"></p></section>
<section class="card"><h2 data-i="info"></h2><p data-i="infoDesc"></p><button id="infoBtn" disabled data-i="readInfo"></button><p id="details"></p></section>
<section class="card"><h2 data-i="backup"></h2><p data-i="backupDesc"></p><button id="backupBtn" disabled data-i="startBackup"></button></section>
<section class="card"><h2 data-i="verify"></h2><p data-i="verifyDesc"></p><label class="small" for="verifyFile" data-i="selectFile"></label><input id="verifyFile" type="file" accept=".bin"><p id="verifyResult" class="small"></p></section>
<section class="card"><h2 data-i="restore"></h2><p data-i="restoreDesc"></p><label class="small" for="restoreFile" data-i="selectFile"></label><input id="restoreFile" type="file" accept=".bin"><p id="restoreInfo" class="small"></p><button id="restoreBtn" disabled data-i="startRestore"></button></section></div>
<div class="notice" data-i="warning"></div><section class="card"><h2 data-i="progressTitle"></h2><progress id="progress" max="100" value="0"></progress><p id="percent">0%</p><div id="log" aria-live="polite"></div></section><footer data-i="footer"></footer></div>
<script type="module">
import {ESPLoader,Transport} from 'https://unpkg.com/esptool-js@0.5.7/bundle.js';
const T={
ar:{title:"مدير أجهزة ESP8266",intro:"اتصال USB، قراءة معلومات الشريحة، نسخة احتياطية كاملة، وفحص واستعادة ملفات BIN.",connect:"الاتصال",connectDesc:"اختر منفذ الجهاز، وسيبدأ وضع تحميل ESP تلقائياً.",connectBtn:"اتصال USB",disconnect:"قطع الاتصال",info:"معلومات الجهاز",infoDesc:"قراءة نوع المعالج ومعرّف ذاكرة Flash.",readInfo:"قراءة المعلومات",backup:"نسخة احتياطية",backupDesc:"قراءة 4MB كاملة وحفظ ملف BIN محلياً.",startBackup:"ابدأ النسخ",verify:"فحص ملف النسخة",verifyDesc:"تحقق من الحجم وبصمة SHA-256 بدون رفع الملف.",selectFile:"اختر ملف BIN",restore:"استعادة النسخة",restoreDesc:"استعادة صورة كاملة بحجم 4MB إلى العنوان 0. العملية تغيّر ذاكرة الجهاز؛ استخدم نسخة موثوقة فقط.",startRestore:"استعادة النظام",warning:"تنبيه: الاستعادة تكتب على ذاكرة Flash وقد تتلف النظام إذا كان الملف غير صحيح. احتفظ بنسختك الأصلية بمكان آخر. لا تفصل USB أثناء أي عملية.",progressTitle:"تقدم العملية",footer:"Chrome أو Edge على الكمبيوتر • HTTPS • بيانات USB لا تُرفع إلى خادم.",ready:"جاهز",busy:"العملية جارية",connected:"متصل: ",disconnected:"غير متصل",notSupported:"المتصفح لا يدعم Web Serial.",reading:"جارٍ قراءة الذاكرة",saved:"تم تنزيل النسخة بنجاح",fileOk:"الحجم صحيح: 4MB",fileBad:"حجم الملف غير صحيح؛ المتوقع 4MB",confirm:"هل أنت متأكد من استعادة هذا الملف؟ سيتم الكتابة فوق النظام الحالي.",typeConfirm:"اكتب RESTORE لتأكيد الاستعادة",restored:"انتهت الاستعادة. افصل الجهاز وأعد تشغيله.",failed:"خطأ: ",flashId:"معرّف Flash",size:"حجم الذاكرة"},
ku:{title:"Rêveberê amûrên ESP8266",intro:"Girêdana USB, agahiyên çîpê, kopiya ewlehiyê ya temam, kontrol û vegerandina pelên BIN.",connect:"Girêdan",connectDesc:"Porta amûrê hilbijêre; moda barkirinê dest pê dike.",connectBtn:"Girêdana USB",disconnect:"Qut bike",info:"Agahiyên amûrê",infoDesc:"Nasîna çîpê û bîra Flash.",readInfo:"Agahiyan bixwîne",backup:"Kopiya ewlehiyê",backupDesc:"Xwendina 4MB û tomarkirina pelê BIN li komputerê.",startBackup:"Dest bi kopiyê bike",verify:"Kontrola pelê",verifyDesc:"Mezinahî û SHA-256 kontrol bike; pel nayê barkirin.",selectFile:"Pelê BIN hilbijêre",restore:"Vegerandina kopiyê",restoreDesc:"Vegerandina pelê 4MB ji navnîşana 0. Ev bîra amûrê diguhere.",startRestore:"Pergalê vegerîne",warning:"Hişyarî: Vegerandin bîra Flash dinivîse. Pelê rast bi kar bîne û USB di dema xebatê de neqetîne.",progressTitle:"Pêşveçûn",footer:"Chrome an Edge • HTTPS • Daneyên USB nayên şandin ser serverê.",ready:"Amade",busy:"Kar dimeşe",connected:"Girêdayî: ",disconnected:"Ne girêdayî",notSupported:"Gerok Web Serial piştgirî nake.",reading:"Bîra Flash tê xwendin",saved:"Kopî hat daxistin",fileOk:"Mezinahî rast e: 4MB",fileBad:"Mezinahî ne rast e; 4MB pêwîst e",confirm:"Tu dixwazî vê kopiyê vegerînî? Pergala niha dê were guhertin.",typeConfirm:"Ji bo pejirandinê RESTORE binivîse",restored:"Vegerandin qediya. Amûrê ji nû ve bide destpêkirin.",failed:"Çewtî: ",flashId:"Nasnameya Flash",size:"Mezinahiya bîrê"},
en:{title:"ESP8266 Device Manager",intro:"USB connection, chip information, full flash backup, BIN verification and restoration.",connect:"Connect",connectDesc:"Select the board serial port to enter the ESP download mode.",connectBtn:"Connect USB",disconnect:"Disconnect",info:"Device information",infoDesc:"Read chip model and flash ID.",readInfo:"Read information",backup:"Flash backup",backupDesc:"Read all 4MB and save a BIN file locally.",startBackup:"Start backup",verify:"Verify backup",verifyDesc:"Check size and SHA-256 locally; no upload.",selectFile:"Choose BIN file",restore:"Restore backup",restoreDesc:"Restore a complete 4MB image at address 0. This overwrites device flash.",startRestore:"Restore firmware",warning:"Warning: Restore writes flash and may render the device unusable if the image is incorrect. Keep your original backup elsewhere. Never unplug USB during operations.",progressTitle:"Operation progress",footer:"Desktop Chrome or Edge • HTTPS • Serial data never uploaded.",ready:"Ready",busy:"Operation running",connected:"Connected: ",disconnected:"Disconnected",notSupported:"Web Serial is unsupported in this browser.",reading:"Reading flash",saved:"Backup downloaded",fileOk:"Valid size: 4MB",fileBad:"Wrong size: expected 4MB",confirm:"Restore this file? Your current firmware will be overwritten.",typeConfirm:"Type RESTORE to confirm",restored:"Restore complete. Reboot the board.",failed:"Error: ",flashId:"Flash ID",size:"Flash size"}};
const $=id=>document.getElementById(id);let transport=null,loader=null,chip='',working=false,verified=null;
const tx=key=>T[$('lang').value][key];function log(s){$('log').textContent+='\n'+String(s);$('log').scrollTop=$('log').scrollHeight}function prog(n){$('progress').value=Math.min(100,Math.max(0,n));$('percent').textContent=Math.round(n)+'%'}function controls(){const on=!!loader; $('connectBtn').disabled=on||working;$('disconnectBtn').disabled=!on||working;$('infoBtn').disabled=!on||working;$('backupBtn').disabled=!on||working;$('restoreBtn').disabled=!on||working||!verified;$('verifyFile').disabled=working;$('restoreFile').disabled=working}
function render(){const l=$('lang').value;document.documentElement.lang=l;document.body.dir=l==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tx(e.dataset.i));$('status').textContent=loader?tx('connected')+chip:tx('disconnected');localStorage.setItem('esp-lang',l);controls()}
$('lang').value=localStorage.getItem('esp-lang')||'ar';$('lang').onchange=render;render();
async function job(fn){if(working)return;working=true;controls();prog(0);try{await fn()}catch(e){log(tx('failed')+(e?.message||String(e)))}finally{working=false;controls()}}
$('connectBtn').onclick=()=>job(async()=>{if(!('serial' in navigator))throw Error(tx('notSupported'));const port=await navigator.serial.requestPort();transport=new Transport(port,true);loader=new ESPLoader({transport,baudrate:115200,terminal:{clean(){},writeLine:log,write:log},debugLogging:false});try{chip=await loader.main();$('status').textContent=tx('connected')+chip;log(tx('connected')+chip)}catch(e){loader=null;await transport.disconnect().catch(()=>{});transport=null;throw e}});
$('disconnectBtn').onclick=()=>job(async()=>{await transport.disconnect();transport=null;loader=null;chip='';render();log(tx('disconnected'))});
$('infoBtn').onclick=()=>job(async()=>{const id=await loader.readFlashId();const hex='0x'+(id>>>0).toString(16).padStart(6,'0');$('details').textContent=chip+'\n'+tx('flashId')+': '+hex+'\n'+tx('size')+': 4MB (configured)';log($('details').textContent);prog(100)});
function save(data,name){const url=URL.createObjectURL(new Blob([data],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
$('backupBtn').onclick=()=>job(async()=>{log(tx('reading'));const data=await loader.readFlash(0,4194304,(_packet,done,total)=>prog(done/total*100));if(data.length!==4194304)throw Error('Incomplete backup: '+data.length);save(data,'esp8266_backup_'+new Date().toISOString().replace(/[:.]/g,'-')+'.bin');prog(100);log(tx('saved')+' (4,194,304 bytes)')});
async function hash(data){const d=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
$('verifyFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;const ok=f.size===4194304;$('verifyResult').textContent=(ok?tx('fileOk'):tx('fileBad'))+'\nSHA-256: '+await hash(await f.arrayBuffer())};
$('restoreFile').onchange=async e=>{verified=null;const f=e.target.files[0];if(!f){$('restoreInfo').textContent='';controls();return}if(f.size!==4194304){$('restoreInfo').textContent=tx('fileBad');controls();return}const data=new Uint8Array(await f.arrayBuffer());const sha=await hash(data);verified={name:f.name,data,sha};$('restoreInfo').textContent=tx('fileOk')+'\nSHA-256: '+sha;controls()};
$('restoreBtn').onclick=()=>{if(!verified||working)return;if(!confirm(tx('confirm')))return;if(prompt(tx('typeConfirm'))!=='RESTORE')return;job(async()=>{const v=verified;log('Restoring '+v.name);const chunks=[];for(let i=0;i<v.data.length;i+=32768){chunks.push(String.fromCharCode(...v.data.subarray(i,i+32768)))}const binary=chunks.join('');await loader.writeFlash({fileArray:[{data:binary,address:0}],flashMode:'keep',flashFreq:'keep',flashSize:'keep',eraseAll:false,compress:true,reportProgress:(_i,done,total)=>prog(done/total*100)});prog(100);log(tx('restored'));await loader.after('hard_reset')})};
</script></body></html>
